[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-ai"
version = "1.0.0"
description = "Universal Coding Agent Automation — Safe, rule-based permission and approval assistant for Cursor, Claude Code, Antigravity, and Copilot."
readme = "README.md"
authors = [{ name = "AutoPilot AI Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0; extra == 'gui'",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0"
]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0"
]

[project.scripts]
autopilot-ai = "autopilot.main:main"
